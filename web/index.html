<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#080504">
  <meta name="description" content="Halloween 2026 live photo wall by Narwhall">
  <title>NARWHALL — Halloween 2026</title>
  <link rel="stylesheet" href="/styles.css">
</head>
<body>
  <div class="haunted-scene" aria-hidden="true"><span class="moon"></span><span class="castle">♜</span><span class="bat bat-one">🦇</span><span class="bat bat-two">🦇</span></div>
  <main class="page-shell">
    <header class="hero">
      <img class="narwhall-logo" src="/narwhall-logo.svg" alt="NARWHALL">
      <p class="kicker"><span>🎃</span> HALLOWEEN 2026 <span>🎃</span></p>
      <p class="tagline">Be part of our wall.</p>
      <div class="orange-swoosh" aria-hidden="true"></div>
    </header>

    <section class="join-section" aria-label="Take a Halloween photo">
      <button class="primary-button take-photo-main" id="uploadMain" type="button">📷 &nbsp;Take a Photo</button>
    </section>

    <div class="divider"><span>✦</span></div>

    <section class="wall-section" aria-labelledby="wallTitle">
      <div class="section-heading">
        <p class="tiny-label">LIVE WALL</p>
        <h2 id="wallTitle">Your photos. Live.</h2>
        <p class="wall-subtitle">SNAP <span>•</span> PIN <span>•</span> SEE IT HERE</p>
      </div>
      <div id="status" class="status" role="status" aria-live="polite">Loading the wall…</div>
      <div id="wall" class="wall" aria-live="polite"></div>
    </section>

    <footer class="footer"><img src="/narwhall-logo.svg" alt="Narwhall"><span>Be part of our wall. · Halloween 2026</span></footer>
  </main>

  <div class="modal" id="uploadModal" hidden>
    <div class="modal-backdrop"></div>
    <section class="modal-card photo-stage" role="dialog" aria-modal="true" aria-labelledby="uploadTitle">
      <button class="close-button" id="closeUpload" type="button" aria-label="Close">×</button>
      <form id="uploadForm">
        <input id="photoInput" name="photo" type="file" accept="image/*" capture="environment" required>

        <div id="cameraPrompt" class="camera-prompt">
          <p class="tiny-label">📷 CAMERA</p>
          <h2 id="uploadTitle">Take your photo.</h2>
          <button class="primary-button take-photo-button" id="openCamera" type="button">Open Camera</button>
        </div>

        <div id="photoReview" class="photo-review" hidden>
          <div class="photo-polaroid-paper">
            <div class="photo-polaroid-image"><img id="previewImage" alt="Your Halloween photo"></div>
            <label class="photo-polaroid-caption" for="caption">
              <span class="caption-placeholder">Write something…</span>
              <input id="caption" name="caption" type="text" maxlength="15" autocomplete="off" placeholder="Write something…">
            </label>
          </div>

          <div id="uploadError" class="form-message error" role="alert" hidden></div>
          <div id="uploadSuccess" class="form-message success" role="status" hidden></div>
          <div class="progress" id="progressWrap" hidden><span id="progressBar"></span></div>
          <div class="photo-actions">
            <button class="secondary-button" id="retakePhoto" type="button">Retake</button>
            <button class="primary-button" id="submitUpload" type="submit">Pin</button>
          </div>
        </div>
        <input class="honeypot" name="website" tabindex="-1" autocomplete="off" aria-hidden="true">
      </form>
    </section>
  </div>

  <div class="lightbox" id="lightbox" hidden><button id="closeLightbox" type="button" aria-label="Close photo">×</button><img id="lightboxImage" alt="Enlarged wall photo"></div>
  <script src="/app.js"></script>
</body>
</html>
